<div class="flex h-screen w-screen flex-col">
  <div class="flex items-center gap-2 border-b border-gray-300 p-2">
    <button mat-stroked-button (click)="onExport()">Export JSON</button>
    <button mat-stroked-button (click)="fileInput.click()">
      Import JSON
    </button>
    <button
      mat-stroked-button
      [disabled]="exportingImage()"
      (click)="onSaveImage()"
    >
      {{ exportingImage() ? 'Saving…' : 'Save Image' }}
    </button>
    <input
      #fileInput
      type="file"
      accept="application/json"
      class="hidden"
      (change)="onImportFileSelected($event)"
    />
    <mat-form-field appearance="outline" [subscriptSizing]="'dynamic'" class="ml-auto w-48">
      <mat-label>Device</mat-label>
      <mat-select
        [value]="deviceStore.deviceType()"
        (valueChange)="deviceStore.setDeviceType($event)"
      >
        @for (deviceType of deviceTypes; track deviceType) {
          <mat-option [value]="deviceType">{{
            deviceTypeLabels[deviceType]
          }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
  <div class="min-h-0 flex-1">
    <app-layout
      [showThumb3Switch]="deviceStore.showThumb3Switch()"
      [keyLabelMap]="layoutStore.labels()"
      (keyClick)="onKeyClick($event)"
    ></app-layout>
  </div>
</div>
