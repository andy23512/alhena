@if (layout(); as l) {
  @for (line of l.lines; track $index) {
    <svg:text
      [attr.x]="x()"
      [attr.y]="lineY($index, l.lines.length, l.fontSize)"
      dominant-baseline="central"
      text-anchor="middle"
      [style.font-size.px]="l.fontSize"
      [class.material-symbols-rounded]="l.isIcon"
      class="fill-current"
    >{{ line }}</svg:text>
  }
}
