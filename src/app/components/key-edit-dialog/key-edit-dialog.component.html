<h2 mat-dialog-title>Edit key #{{ data.positionCode }}</h2>
<mat-dialog-content class="flex flex-col gap-4 pt-2">
  <mat-button-toggle-group
    [value]="type()"
    (change)="type.set($event.value)"
  >
    <mat-button-toggle [value]="KeyLabelType.Text">Text</mat-button-toggle>
    <mat-button-toggle [value]="KeyLabelType.Icon">Icon</mat-button-toggle>
  </mat-button-toggle-group>

  @if (type() === KeyLabelType.Text) {
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Label text</mat-label>
      <input
        matInput
        [value]="value()"
        (input)="onValueInput($event)"
        (keydown.enter)="save()"
      />
    </mat-form-field>
  } @else {
    <app-icon-picker [(selected)]="value"></app-icon-picker>
    @if (value()) {
      <div class="flex items-center gap-2 text-sm text-gray-600">
        <span class="material-symbols-rounded text-3xl">{{ value() }}</span>
        <span>{{ value() }}</span>
      </div>
    }
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="clear()">Clear</button>
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
