<h2 mat-dialog-title>Edit key #{{ data.positionCode }}</h2>
<mat-dialog-content class="flex flex-col gap-4 pt-2">
  <mat-button-toggle-group
    [value]="type()"
    (change)="type.set($event.value)"
  >
    <mat-button-toggle [value]="KeyLabelType.Text">Text</mat-button-toggle>
    <mat-button-toggle [value]="KeyLabelType.Icon">Icon</mat-button-toggle>
  </mat-button-toggle-group>

  @if (type() === KeyLabelType.Text) {
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Label text</mat-label>
      <input
        matInput
        [value]="value()"
        (input)="onValueInput($event)"
        (keydown.enter)="save()"
      />
    </mat-form-field>
  } @else {
    <app-icon-picker [(selected)]="value"></app-icon-picker>
    @if (value()) {
      <div
        class="flex items-center gap-2 text-sm text-[color:var(--mat-sys-on-surface-variant)]"
      >
        <span class="material-symbols-rounded text-3xl">{{ value() }}</span>
        <span>{{ value() }}</span>
      </div>
    }
  }

  <div class="flex flex-col gap-2">
    <span class="text-sm text-[color:var(--mat-sys-on-surface-variant)]">Key color</span>
    <div class="flex flex-wrap gap-2">
      <button
        type="button"
        class="h-8 w-8 rounded-full border-2 border-dashed border-gray-400 text-xs"
        [class.ring-2]="!color()"
        aria-label="No color"
        (click)="color.set(undefined)"
      >✕</button>
      @for (name of keyColorNames; track name) {
        <button
          type="button"
          class="h-8 w-8 rounded-full border border-gray-400"
          [class.ring-2]="color() === name"
          [style.background-color]="keyColors[name]"
          [attr.aria-label]="name"
          (click)="color.set(name)"
        ></button>
      }
    </div>
  </div>
  <mat-checkbox [checked]="dimmed()" (change)="dimmed.set($event.checked)">
    Dim this key
  </mat-checkbox>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="clear()">Clear</button>
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
